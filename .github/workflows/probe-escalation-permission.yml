# escalation-policy: none
# escalation-reason: temporary probe; its result is read by the operator who dispatches it
#
# TEMPORARY. Delete this file once tsukumogami/tsuku#2600 records its result.
#
# Isolates ONE variable: whether the default GITHUB_TOKEN can create an issue
# when the workflow declares no `permissions:` block.
#
# It files with `r2-degradation`, a label that ALREADY EXISTS. That is the
# control: nothing about a missing label can explain a failure here, so a
# failure isolates the permission and nothing else. The sibling probe
# (probe-escalation-label.yml) holds the permission constant and varies the
# label, which is the other half of the experiment.
#
# Expected if the permission defect is real:
#   GraphQL: Resource not accessible by integration (createIssue)
#
# If it SUCCEEDS, the default token does carry issues: write, the permission
# defect does not exist, and the requirement for it in #2606 is withdrawn
# rather than satisfied. Record that outcome either way -- the repository's
# default workflow-permission setting cannot be read with the credentials
# available, so this run is the evidence.
name: Probe - escalation permission

on:
  workflow_dispatch:

# Deliberately NO permissions block. That absence is the subject of the
# experiment; adding one here would destroy it.

jobs:
  probe:
    name: File an issue with an existing label and no declared permission
    runs-on: ubuntu-latest
    steps:
      - name: Attempt to create an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No 2>/dev/null and no || true: the failure IS the result, and
          # suppressing it would reproduce the defect this milestone removes.
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Probe: escalation permission (tsukumogami/tsuku#2600)" \
            --body "Temporary probe for #2600. Run: $RUN_URL

          This issue existing means the default GITHUB_TOKEN CAN create issues with no
          \`permissions:\` block declared, so the permission half of the stacked defect
          does not exist. Close this issue and record that on #2600." \
            --label "r2-degradation"
