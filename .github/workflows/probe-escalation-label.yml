# escalation-policy: none
# escalation-reason: temporary probe; its result is read by the operator who dispatches it
#
# TEMPORARY. Delete this file once tsukumogami/tsuku#2600 records its result.
#
# Isolates the OTHER variable: whether a nonexistent label fails the call
# before the permission is ever reached.
#
# It declares `issues: write`, so the permission is held constant and cannot
# explain a failure. It files with a label that does not exist and is not in
# the manifest. A failure here isolates the label and nothing else.
#
# Expected if the label defect is real:
#   could not add label: '<name>' not found
#
# The pair matters because `gh` resolves a label BEFORE it calls createIssue.
# On a workflow missing both, only the label error is ever visible and the
# permission error hides behind it -- which is why repairing labels alone
# would look complete and leave workflows just as red.
name: Probe - escalation label

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: File an issue with a nonexistent label and the permission granted
    runs-on: ubuntu-latest
    steps:
      - name: Attempt to create an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Probe: escalation label (tsukumogami/tsuku#2600)" \
            --body "Temporary probe for #2600. Run: $RUN_URL

          This issue existing means a nonexistent label did NOT fail the call, which
          contradicts the diagnosis. Close this issue and record that on #2600." \
            --label "probe-label-that-does-not-exist"
