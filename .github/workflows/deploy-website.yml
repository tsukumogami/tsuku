name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'blog/**'
      - 'internal/recipe/recipes/**/*.toml'
      - 'recipes/**/*.toml'
      - 'scripts/generate-registry.py'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'blog/**'
      - 'internal/recipe/recipes/**/*.toml'
      - 'recipes/**/*.toml'
      - 'scripts/generate-registry.py'
      - '.github/workflows/deploy-website.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Hugo
        env:
          HUGO_VERSION: "0.147.0"
        run: |
          wget -q -O /tmp/hugo_${HUGO_VERSION}_linux-amd64.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb
          wget -q -O /tmp/hugo_checksums.txt \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt
          cd /tmp && grep "hugo_${HUGO_VERSION}_linux-amd64.deb" hugo_checksums.txt | sha256sum -c
          sudo dpkg -i /tmp/hugo_${HUGO_VERSION}_linux-amd64.deb

      - name: Build blog
        run: hugo --source blog --destination $PWD/website/blog

      - name: Generate recipes.json
        run: |
          python3 scripts/generate-registry.py
          cp _site/recipes.json website/

      # Pages treats a deploy to the project's production branch as production
      # and any other branch name as a preview, so pull requests deploy to a
      # preview named after their head branch. The name is reduced to a safe
      # character set before it reaches the wrangler command line.
      - name: Resolve deploy branch
        id: branch
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          name=$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9._/-' '-')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Deploying to Pages branch: $name"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOYER_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy website --project-name=tsuku-dev --branch=${{ steps.branch.outputs.name }}
