name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/scripts/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/scripts/**'
      - '.github/workflows/integration-tests.yml'

jobs:
  checksum-pinning:
    name: "Checksum Pinning Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run checksum pinning tests across families
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSUKU_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
        run: |
          FAMILIES=(debian rhel arch alpine suse)
          FAILED=()
          for family in "${FAMILIES[@]}"; do
            echo "::group::Checksum pinning on $family"
            if ! timeout 300 ./test/scripts/test-checksum-pinning.sh "$family"; then
              FAILED+=("$family")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed families: ${FAILED[*]}"
            exit 1
          fi
          echo "All checksum pinning tests passed"

  homebrew-linux:
    name: "Homebrew Linux Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run homebrew recipe tests across families
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSUKU_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
        run: |
          # alpine excluded: pkg-config uses apk_install (not homebrew) on musl
          FAMILIES=(debian rhel arch suse)
          FAILED=()
          for family in "${FAMILIES[@]}"; do
            echo "::group::Homebrew pkg-config on $family"
            if ! timeout 300 ./test/scripts/test-homebrew-recipe.sh pkg-config "$family"; then
              FAILED+=("$family")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed families: ${FAILED[*]}"
            exit 1
          fi
          echo "All homebrew tests passed"

  library-integrity:
    name: "Library Integrity Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run library integrity tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSUKU_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
        run: |
          LIBRARIES=(zlib libyaml)
          FAILED=()
          for lib in "${LIBRARIES[@]}"; do
            echo "::group::Library integrity: $lib (debian)"
            if ! timeout 300 ./test/scripts/test-library-integrity.sh "$lib" debian; then
              FAILED+=("$lib")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed libraries: ${FAILED[*]}"
            exit 1
          fi
          echo "All library integrity tests passed"

  library-dlopen-glibc:
    name: "Library dlopen Tests (glibc)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            cmd/tsuku-dltest/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-dltest-${{ runner.os }}-${{ hashFiles('cmd/tsuku-dltest/Cargo.lock') }}
          restore-keys: |
            rust-dltest-${{ runner.os }}-

      - name: Run dlopen tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSUKU_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
        run: |
          # openssl included again: its verification failed because only $TSUKU_HOME/libs
          # reached the loader path, where no .so lives, so the system libcrypto won (#1090).
          LIBRARIES=(zlib libyaml gcc-libs openssl)
          FAILED=()
          for lib in "${LIBRARIES[@]}"; do
            echo "::group::dlopen: $lib (glibc)"
            if ! timeout 300 ./test/scripts/test-library-dlopen.sh "$lib" debian; then
              FAILED+=("$lib")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed libraries: ${FAILED[*]}"
            exit 1
          fi
          echo "All glibc dlopen tests passed"

  # musl/Alpine dlopen tests use recipe-derived package lists.
  # This validates that recipes correctly declare their system dependencies.
  library-dlopen-musl:
    name: "Library dlopen Tests (musl)"
    runs-on: ubuntu-latest
    container:
      image: golang:1.23-alpine
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # rustup-init is fetched at a fixed version and checked against a committed sha256
      # before it runs, rather than piping sh.rustup.rs into sh. To bump it, change both
      # values together; the hash is the content of
      # https://static.rust-lang.org/rustup/archive/<version>/x86_64-unknown-linux-musl/rustup-init.sha256
      # The toolchain rustup then installs is verified by rustup against the channel manifest.
      - name: Install bootstrap dependencies
        env:
          RUSTUP_VERSION: 1.29.1
          RUSTUP_INIT_SHA256: 331228566cc931f32cd684f9bebc5956a5e5d7394c8d5de595f196a658ab98e6
        run: |
          set -eu
          apk add --no-cache curl gcc musl-dev bash git
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-musl/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable
          rm /tmp/rustup-init

      - name: Build tsuku
        run: go build -o tsuku ./cmd/tsuku

      - name: Run dlopen tests
        shell: bash -e {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSUKU_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
        run: |
          source $HOME/.cargo/env
          LIBRARIES=(zlib libyaml gcc-libs)
          FAILED=()
          for lib in "${LIBRARIES[@]}"; do
            echo "::group::dlopen: $lib (musl)"
            # Install recipe-declared packages for this library
            DEPS=$(./tsuku info --deps-only --system --family alpine "$lib")
            if [ -n "$DEPS" ]; then
              echo "Installing recipe-declared packages: $DEPS"
              apk add --no-cache $DEPS
            fi
            if ! timeout 300 ./test/scripts/test-library-dlopen.sh "$lib" alpine; then
              FAILED+=("$lib")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed libraries: ${FAILED[*]}"
            exit 1
          fi
          echo "All musl dlopen tests passed"

  library-dlopen-macos:
    name: "Library dlopen Tests (darwin)"
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            cmd/tsuku-dltest/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-dltest-${{ runner.os }}-${{ hashFiles('cmd/tsuku-dltest/Cargo.lock') }}
          restore-keys: |
            rust-dltest-${{ runner.os }}-

      - name: Run dlopen tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSUKU_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
        run: |
          # openssl included again: its verification failed because only $TSUKU_HOME/libs
          # reached the loader path, where no .so lives, so the system libcrypto won (#1090).
          LIBRARIES=(zlib libyaml gcc-libs openssl)
          FAILED=()
          for lib in "${LIBRARIES[@]}"; do
            echo "::group::dlopen: $lib (darwin)"
            if ! ./test/scripts/test-library-dlopen.sh "$lib" darwin; then
              FAILED+=("$lib")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed libraries: ${FAILED[*]}"
            exit 1
          fi
          echo "All darwin dlopen tests passed"

  nvm-data-root:
    name: "nvm Data Root Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run nvm data root tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Points the registry at this PR's head, so the run installs the nvm recipe as
          # changed here rather than the one already on main.
          TSUKU_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
        run: |
          ./test/scripts/test-nvm-data-root.sh
