# TEMPORARY. Delete before this PR is marked ready.
#
# The Codecov step in test.yml is gated `if: github.event_name == 'push'`, so PR CI
# cannot exercise it. This probe runs the same code path on a pull_request so the fix
# for #2494 can be verified on a runner instead of merged on reasoning alone.

name: TEMP Codecov probe

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    name: Probe keybase key URLs and the repinned action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Negative control plus positive control in the same runner, so a difference
      # is attributable to the account move and not to the environment.
      - name: Fetch both keybase key URLs
        run: |
          for account in codecovsecurity codecovsecops; do
            url="https://keybase.io/${account}/pgp_keys.asc"
            code=$(curl -s -o body.txt -w '%{http_code}' "$url")
            echo "--- ${account}: HTTP ${code}, $(wc -c < body.txt) bytes"
            head -c 120 body.txt
            echo
            gpg --show-keys --with-colons body.txt 2>/dev/null \
              | awk -F: '/^fpr/ {print "    fingerprint: " $10}' \
              || echo "    no key parsed"
          done

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Produce a coverage profile
        run: go test -short -coverprofile=coverage.out ./internal/platform/...

      # The old pin has to run FIRST. gpg's keyring lives in ~/.gnupg and persists
      # across steps, so whichever action runs first is the only one testing against a
      # clean keyring -- run the new pin first and the old pin verifies happily off the
      # key the new one just imported. This ordering is what makes it a real control.
      # Expected to fail; continue-on-error keeps both results in one run.
      - name: Run the old pin against a clean keyring (expected to fail)
        continue-on-error: true
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true
          dry_run: true

      # Same pin and same inputs as the fixed test.yml step. dry_run keeps this from
      # writing anything to Codecov while still exercising download plus signature
      # verification, which is the part that fails today.
      - name: Run the repinned action (dry run)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true
          dry_run: true
