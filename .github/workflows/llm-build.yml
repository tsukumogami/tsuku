name: tsuku-llm Build

# Builds tsuku-llm on the same runners, with the same steps, as the build-llm
# job in release.yml, minus the upload, whenever a pull request touches the
# addon. Change the two together.
#
# Before this, nothing built tsuku-llm on macOS until a release tag was pushed
# (test.yml's LLM job is Linux-only and its paths filter skips tsuku-llm/**).
# So a runner image change that broke the build, like Homebrew's OpenSSL 4
# landing on macos-latest (#2757), surfaced only as a half-published release.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tsuku-llm/**'
      - 'proto/**'
      - '.github/workflows/llm-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-llm:
    name: "Build tsuku-llm (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            backend: metal
          - platform: darwin-amd64
            runner: macos-15-intel
            backend: metal
          - platform: linux-amd64-cuda
            runner: ubuntu-22.04
            backend: cuda
          - platform: linux-amd64-vulkan
            runner: ubuntu-22.04
            backend: vulkan
          - platform: linux-arm64-cuda
            runner: ubuntu-24.04-arm
            backend: cuda
          - platform: linux-arm64-vulkan
            runner: ubuntu-24.04-arm
            backend: vulkan
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: true
          sparse-checkout: |
            tsuku-llm
            proto

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"

      - name: Install protobuf compiler
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            brew install protobuf
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Install CUDA toolkit (Linux CUDA builds)
        if: matrix.backend == 'cuda' && startsWith(matrix.runner, 'ubuntu')
        run: |
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "amd64" ]; then
            REPO_ARCH="x86_64"
            DISTRO="ubuntu2204"
            CUDA_VER="12-4"
          else
            REPO_ARCH="sbsa"
            DISTRO="ubuntu2404"
            CUDA_VER="12-6"
          fi
          wget "https://developer.download.nvidia.com/compute/cuda/repos/${DISTRO}/${REPO_ARCH}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y "cuda-toolkit-${CUDA_VER}"
          CUDA_MAJOR_MINOR="${CUDA_VER//-/.}"
          echo "/usr/local/cuda-${CUDA_MAJOR_MINOR}/bin" >> $GITHUB_PATH
          echo "CUDA_PATH=/usr/local/cuda-${CUDA_MAJOR_MINOR}" >> $GITHUB_ENV

      - name: Install Vulkan SDK (Linux Vulkan builds)
        if: matrix.backend == 'vulkan' && startsWith(matrix.runner, 'ubuntu')
        run: |
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "amd64" ]; then
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
              https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          else
            sudo apt-get update
            sudo apt-get install -y libvulkan-dev spirv-tools glslang-tools glslc
          fi
          echo "VULKAN_SDK=/usr" >> $GITHUB_ENV

      - name: Build release binary
        working-directory: tsuku-llm
        env:
          LLAMA_BACKEND: ${{ matrix.backend }}
        run: cargo build --release --features "${{ matrix.backend }}"

      - name: Sign binary (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: codesign -s - tsuku-llm/target/release/tsuku-llm

      - name: Smoke-test binary
        run: tsuku-llm/target/release/tsuku-llm --version
