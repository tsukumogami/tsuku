name: Update Queue Status

on:
  # A change to this workflow or to the queue-maintain code it runs has to
  # trigger it too, or a fix to either waits for unrelated recipe or
  # failure traffic before it takes effect.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'data/failures/**'
      - '.github/workflows/update-queue-status.yml'
      - 'cmd/queue-maintain/**'
      - 'internal/batch/**'
      - 'internal/blocker/**'
      - 'internal/markfailures/**'
      - 'internal/requeue/**'
      - 'internal/reorder/**'

permissions:
  contents: write

concurrency:
  group: queue-operations-status-update
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v2
        with:
          app-id: ${{ secrets.TSUKU_BATCH_GENERATOR_APP_ID }}
          private-key: ${{ secrets.TSUKU_BATCH_GENERATOR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Collect all recipes on disk
        id: detect
        run: |
          # Full scan: find ALL recipe files, not just the diff.
          # This makes the workflow idempotent -- if previous runs were
          # cancelled (GitHub replaces the pending run when a new push
          # arrives), the surviving run catches everything.
          RECIPES=$(find recipes -name '*.toml' -type f 2>/dev/null)

          if [ -z "$RECIPES" ]; then
            echo "No recipes found on disk"
            echo "has_recipes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RECIPE_COUNT=$(echo "$RECIPES" | wc -l)
          echo "Found $RECIPE_COUNT recipe files on disk"
          echo "has_recipes=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.detect.outputs.has_recipes == 'true'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version-file: go.mod

      # queue-maintain's reconcile step marks queue entries success when a
      # recipe on disk covers them: by name, source, satisfies alias or
      # ecosystem key. It replaced a bash copy of the recipe-to-source logic.
      - name: Build and run queue-maintain
        if: steps.detect.outputs.has_recipes == 'true'
        run: |
          go build -o queue-maintain ./cmd/queue-maintain
          ./queue-maintain

      - name: Commit and push changes
        if: steps.detect.outputs.has_recipes == 'true'
        run: |
          QUEUE_FILE="data/queues/priority-queue.json"

          git add "$QUEUE_FILE"
          if git diff --cached --quiet; then
            echo "No queue changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(batch): reconcile queue status with recipes on disk"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Push failed (attempt $((attempt-1))/3), retrying..."
              sleep $((2 ** attempt))
              git pull --rebase
            fi
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
