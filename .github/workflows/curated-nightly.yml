# escalation-policy: issue
# escalation-assignee: dangazineu
# escalation-owned-by: 2611
# escalation-owned-by-reason: #2611 decides this workflow's scope; it validates the full registry, not the curated set, and has never completed
# coverage: items

name: Curated Recipe Nightly
# Nightly cross-platform validation for all recipes with curated = true in
# their [metadata] section. Calls recipe-validation-core.yml (full validation
# suite). A failed run is escalated by the shared escalator (escalate.yml).
# While #2611 is open it is delivered there as a comment; once #2611 closes,
# the escalator files its own item for this workflow again.
#
# Recipes are discovered dynamically — setting curated = true in a recipe's
# [metadata] is sufficient to enroll it in nightly CI.

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Discover all recipes with curated = true; validation is skipped when there
  # are none
  setup:
    name: Discover curated recipes
    runs-on: ubuntu-latest
    outputs:
      has_recipes: ${{ steps.discover.outputs.has_recipes }}
    steps:
      - uses: actions/checkout@v6

      - name: Discover recipes with curated = true
        id: discover
        run: |
          RECIPES=$(grep -rl 'curated = true' recipes/ internal/recipe/recipes/ | sort | jq -R . | jq -sc .)
          COUNT=$(echo "$RECIPES" | jq 'length')

          if [ "$COUNT" -gt 0 ]; then
            echo "has_recipes=true" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT curated recipe(s):"
            echo "$RECIPES" | jq -r '.[]' | sed 's/^/  - /'
          else
            echo "has_recipes=false" >> "$GITHUB_OUTPUT"
            echo "No recipes with curated = true found"
          fi

  # Run full recipe validation (includes all curated recipes)
  validate:
    name: Validate
    needs: setup
    if: needs.setup.outputs.has_recipes == 'true'
    uses: ./.github/workflows/recipe-validation-core.yml
    with:
      auto_constrain: false
    secrets: inherit

