# TEMPORARY, removed before merge. Pre-merge proof for #2448 / #2683.
#
# 1. Runs Nightly Registry Validation's real jobs (through workflow_call) against the
#    objects in R2 today. They sit under the legacy plans/registry/ prefix, which the
#    transform reads as a counted fallback, so this is the first run that compares real
#    registry goldens. It measures shard runtimes and produces the first findings.
# 2. Plants a mismatch: finds a recipe whose golden matches unmodified, changes one URL in
#    that golden, and requires validate-golden.sh and validate-all-golden.sh to fail on
#    it. The row is VOID if the planted file did not change.
name: Golden Layout Proof

on:
  pull_request:
    paths:
      - '.github/workflows/golden-layout-proof.yml'

permissions:
  contents: read
  actions: read

jobs:
  nightly:
    name: Nightly
    uses: ./.github/workflows/nightly-registry-validation.yml
    secrets: inherit

  planted-mismatch:
    name: Planted Mismatch
    needs: nightly
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download golden files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r2-golden-files
          path: r2-golden-files/

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Build tsuku
        run: CGO_ENABLED=0 go build -o tsuku ./cmd/tsuku

      - name: Plant a mismatch and require failure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Candidates: linux-only-by-file recipes with a single version and a url field.
          found=""
          tried=0
          for dir in $(find r2-golden-files/plans -mindepth 2 -maxdepth 2 -type d | sort | awk 'NR % 37 == 0'); do
            recipe=$(basename "$dir")
            [ -f "recipes/${recipe:0:1}/$recipe.toml" ] || continue
            tried=$((tried + 1))
            [ $tried -le 40 ] || break
            rm -rf one && mkdir -p "one/${recipe:0:1}" && cp -r "$dir" "one/${recipe:0:1}/"
            if ./scripts/validate-golden.sh "$recipe" --category registry --os linux --golden-dir one > control.log 2>&1; then
              found="$recipe"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::VOID: no candidate matched unmodified in $tried tries, so no positive control"
            exit 1
          fi
          recipe="$found"
          echo "Control: $recipe matches its golden unmodified"
          tail -3 control.log

          golden=$(ls "one/${recipe:0:1}/$recipe/"*-linux-*.json | head -1)
          before=$(sha256sum "$golden" | cut -d' ' -f1)
          jq '(.. | objects | select(has("url")) | .url) |= (. + "?planted-mismatch")' "$golden" > planted.json
          mv planted.json "$golden"
          after=$(sha256sum "$golden" | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            echo "::error::VOID: planting changed nothing in $golden"
            exit 1
          fi
          echo "Planted: $golden ($before -> $after)"

          rc=0
          ./scripts/validate-golden.sh "$recipe" --category registry --os linux --golden-dir one > planted.log 2>&1 || rc=$?
          grep -m3 'MISMATCH\|planted-mismatch' planted.log || true
          echo "validate-golden.sh on the planted golden: exit $rc"

          rc_all=0
          ./scripts/validate-all-golden.sh --os linux --category registry --golden-dir one > planted-all.log 2>&1 || rc_all=$?
          echo "validate-all-golden.sh on the planted golden: exit $rc_all, $(tail -1 planted-all.log)"

          {
            echo "## Planted mismatch"
            echo "- control: \`$recipe\` matched unmodified"
            echo "- planted: one url in \`$(basename "$golden")\` (sha256 $before -> $after)"
            echo "- validate-golden.sh exit: $rc (expected 1)"
            echo "- validate-all-golden.sh exit: $rc_all (expected 1); $(tail -1 planted-all.log)"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$rc" -eq 1 ] && [ "$rc_all" -eq 1 ]
