# escalation-policy: issue
# escalation-assignee: dangazineu
# coverage: items

# Weekly freshness check for discovery registry entries.
#
# Validates that all entries in recipes/discovery/ still resolve to valid
# sources (repos not archived/deleted, formulas not deprecated, etc.).
#
# On failure, creates a GitHub issue listing stale entries.
name: Discovery Registry Freshness

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC
  workflow_dispatch: {}

# Without this block the default token has no `issues` scope, so the escalation step has
# died at createIssue on every run since at least 2026-06-29. Declaring a block drops every
# unlisted scope to none, so `contents: read` is listed explicitly.
permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Validate Discovery Entries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Build seed-discovery
        run: go build -o seed-discovery ./cmd/seed-discovery

      - name: Validate discovery entries
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./seed-discovery --validate-only recipes/discovery --verbose 2>&1 | tee validation.log
        continue-on-error: true

      - name: Check validation result
        id: check
        run: |
          # The verdict is parsed, not pattern-matched. `grep -q "0 failed"` was a
          # SUBSTRING test, and "0 failed" occurs inside "10 failed", "20 failed" and
          # "100 failed" -- so every count that is a multiple of ten was read as zero,
          # the issue step was skipped by its own condition, and a failing registry
          # reported healthy with no artifact to inspect.
          SUMMARY=$(grep -oE 'Validated [0-9]+ entries: [0-9]+ valid, [0-9]+ failed' validation.log | tail -1 || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::validation.log carries no summary line; the run cannot be judged" >&2
            exit 1
          fi
          FAILED=$(printf '%s' "$SUMMARY" | sed -E 's/.*, ([0-9]+) failed/\1/')
          echo "Summary: $SUMMARY"
          echo "declared_failures=$FAILED" >> $GITHUB_OUTPUT
          if [ "$FAILED" -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create failure issue
        if: steps.check.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DECLARED: ${{ steps.check.outputs.declared_failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Take the WHOLE Failures section. The previous extraction was
          # `grep -A1 "Failures:" | tail -n +2`, which returns exactly one line however
          # many entries follow -- against a real run listing nine stale entries it named
          # one and silently dropped eight.
          FAILURES=$(awk '/^Failures:/{f=1;next} f && /^[[:space:]]+[^[:space:]]/{print;next} f{exit}' validation.log)

          # Assert identity, not presence. The log states its own count, so the report can
          # be checked against it: a truncation, an off-by-one or a format change all show
          # up as a disagreement here rather than as a plausible-looking issue.
          FOUND=$(printf '%s\n' "$FAILURES" | grep -c . || true)
          if [ "${FOUND:-0}" -ne "$DECLARED" ]; then
            echo "::error::extracted $FOUND failure line(s) but the log declares $DECLARED." \
                 "Refusing to file a report that does not match what was found." >&2
            exit 1
          fi

          BODY="$(cat <<EOF
          ## Discovery Registry Freshness Check Failed

          The weekly freshness check found stale entries in the discovery registry.

          **Run:** $RUN_URL

          ### Stale Entries

          \`\`\`
          $FAILURES
          \`\`\`

          ### Next Steps

          1. Check the workflow run for detailed logs
          2. Remove or update stale entries
          3. Re-run the workflow to verify fixes
          EOF
          )"

          # Check for existing open issue
          EXISTING=$(gh issue list --label "maintenance,discovery-registry" --state open --json number --limit 1 | jq -r '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Adding comment to existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating new issue"
            gh issue create \
              --title "[Automated] Discovery Registry Freshness Check Failed - $(date +%Y-%m-%d)" \
              --body "$BODY" \
              --label "maintenance,discovery-registry"
          fi

          exit 1
