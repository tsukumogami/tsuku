name: Lint Workflows

# No `paths:` filter, deliberately. This workflow carries checks that are required, and a
# required check that a path filter skips never reports at all: the pull request waits
# forever on a run that will not happen. The steps are seconds long, so running them on
# every pull request costs less than the branch-protection deadlock would.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, and only what is needed. The policy check resolves the state of the tracking
# issue behind any deferred `escalation-policy: none`, so it needs to read issues. Nothing
# here writes.
permissions:
  contents: read
  issues: read

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      # Copied into .claude/shirabe-extensions/work-on.md (the /work-on verification map), with any deliberate differences noted there; change both together.
      - name: Check for retired runners
        run: .github/scripts/checks/retired-runners.sh
      # Copied into .claude/shirabe-extensions/work-on.md (the /work-on verification map), with any deliberate differences noted there; change both together.
      - name: Check CI consolidation patterns
        run: .github/scripts/checks/ci-patterns-lint.sh
      # Copied into .claude/shirabe-extensions/work-on.md (the /work-on verification map), with any deliberate differences noted there; change both together.
      - name: Check matrix recipe passthrough
        run: .github/scripts/checks/matrix-recipe-passthrough.sh
      # Copied into .claude/shirabe-extensions/work-on.md (the /work-on verification map), with any deliberate differences noted there; change both together.
      - name: Check label references resolve
        run: .github/scripts/checks/label-references.py
      # The check's own self-test. A check nobody has seen fail is a check nobody knows
      # works, so its failure modes are verified on every run rather than once in a pull
      # request description.
      - name: Check label reference check can fail
        run: .github/scripts/checks/label-references_test.sh
      # Copied into .claude/shirabe-extensions/work-on.md (the /work-on verification map), with any deliberate differences noted there; change both together.
      - name: Check escalation declarations and registry agree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/checks/workflow-policy.py
      # The parser's own self-test. A check nobody has seen fail is a check nobody knows
      # works, and this one's whole value is the two-way comparison, which is exactly the
      # part that would silently become one-way.
      - name: Check workflow policy check can fail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/checks/workflow-policy_test.sh
      # Copied into .claude/shirabe-extensions/work-on.md (the /work-on verification map), with any deliberate differences noted there; change both together.
      - name: Check escalation hygiene
        run: .github/scripts/checks/escalation-hygiene.py
      # Its own self-test. Every assertion in the hygiene check has a row that proves it
      # can fail, because a hygiene check that cannot fail would be a fitting end to a
      # milestone about checks that cannot fail.
      - name: Check escalation hygiene check can fail
        run: .github/scripts/checks/escalation-hygiene_test.sh
      # The sweeper's regression cases. Hermetic: `gh` is replaced on PATH by a stub, which
      # is what makes "failed then recovered" and "previous sweep older than any fixed
      # lookback" constructible rather than approximated.
      - name: Check the sweeper's selection logic
        run: .github/scripts/checks/escalate-sweep_test.sh
      # Ownership routing, through the listener and the sweeper. Each case asserts where
      # the run went -- a comment on the owner and a receipt naming it -- because "no new
      # issue" is also what an escalator that does nothing produces.
      - name: Check failures route to the issue that owns them
        run: .github/scripts/checks/escalate-owned_test.sh
      # The backstop's own regression cases (#2607). Hermetic: `gh` is a stub that filters
      # by the query's own parameters, and declarations come from a sandbox git repository,
      # so a pull request trying to exempt a workflow in its own diff is a real case.
      - name: Check the escalation backstop can fail, and says why
        run: .github/scripts/checks/escalation-backstop_test.py

      # The R2 health check gates Nightly Registry Validation, R2 Cleanup and the golden
      # file workflows, and R2 Health Monitor reports its verdict. These cases pin that the
      # verdict times the storage request rather than the start-up of the program making
      # it (#2593), against a local stand-in for R2 that only accepts signed requests.
      - name: Check the R2 health check times the request
        run: scripts/r2-health-check_test.sh

  # The escalation backstop (#2607): was every recent failure of a registered workflow told
  # to someone? Its own job, so its verdict is its own check and neither hides nor is hidden
  # by the lint results above.
  #
  # Its red is about the REPOSITORY, not the pull request it appears on. The job name and
  # the first line of its output say so in a fixed form, so a pull request whose only red is
  # this job can be recognised as not being at fault:
  #   "Escalation backstop (repository health): FINDING, not a fault in this pull request"
  #   "Escalation backstop (repository health): COULD NOT CHECK, ..." (an API error after
  #   retries; never reported as a finding)
  #
  # Independent of the escalator by construction: a different trigger (pull_request and
  # push, not workflow_run or schedule), a different script (it never calls escalate.sh),
  # and its own job-scoped token with no write scope. Declarations are read from the default
  # branch, fetched below, not from the pull request's head.
  escalation-backstop:
    name: Escalation Backstop (repository health)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Fetch the default branch's declarations
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
      - name: Check every recent failure reached someone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          .github/scripts/checks/escalation-backstop.py --ref "origin/${DEFAULT_BRANCH}" | tee backstop.txt
          status=${PIPESTATUS[0]}
          { echo '## Escalation backstop (repository health)'; echo '```'; cat backstop.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
