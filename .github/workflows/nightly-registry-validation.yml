# escalation-policy: issue
# escalation-assignee: dangazineu
# escalation-owned-by: 2695
# escalation-owned-by-reason: #2695 is what NRV fails on once it compares anything: 297 registry golden plans in R2 have drifted from what the code generates
# coverage: items

# Nightly validation of registry recipe golden files.
#
# This workflow validates all registry recipes by downloading golden files
# from R2 storage and comparing freshly generated plans against them.
#
# R2 health gates the run:
# - healthy: download golden files, run validation
# - degraded (R2 answered, but slowly): validate anyway, with a warning. R2 answered, so
#   there is nothing to skip for.
# - unavailable (R2 did not answer): skip validation, and fail the run on purpose so a
#   night that validated nothing is not reported as a green one.
#
# The skip path does not file its own issue. This workflow is registered with the
# escalator (escalate.yml / escalate-sweep.yml), which carries a failed run to its tracked
# item. A skipped night reaches that item by failing; a filing step that succeeded would
# instead turn the run green, and the escalator reads green as recovery (#2657).
#
# Coverage (#2608). A run that validated nothing must not conclude success, and until
# #2608 every green run of this workflow had validated nothing. So each leg writes a
# receipt as it works, one line per golden file or sampled letter, and Assert Coverage
# compares those receipts against a declared set that no leg supplies: the golden files
# come from a listing of the bucket taken separately from the sync, and the sample's
# letters are fixed. A leg that is skipped, killed, or reaches fewer files than were
# declared fails the run, naming both numbers.
#
# See docs/designs/DESIGN-r2-golden-storage.md for architecture details.
name: Nightly Registry Validation

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  # Allow manual trigger
  workflow_dispatch:

env:
  # Where the declared set is listed from. The item names in it come from the last three
  # key segments (<recipe>/v<version>/<platform>.json), so the category segment between
  # this prefix and the recipe -- `registry` or a letter -- does not change them (#2448).
  GOLDEN_LISTING_PREFIX: plans/
  GOLDEN_LISTING_EXCLUDE: plans/embedded/

jobs:
  # Check R2 availability before validation
  health-check:
    name: R2 Health Check
    runs-on: ubuntu-latest
    outputs:
      r2_available: ${{ steps.check.outputs.r2_available }}
      health_status: ${{ steps.check.outputs.health_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check R2 health
        id: check
        env:
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_READONLY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_READONLY }}
        run: |
          echo "Checking R2 health..."

          # Only "unavailable" skips validation. "degraded" means R2 answered 200, slowly,
          # so the downloads that follow can still work.
          set +e
          ./scripts/r2-health-check.sh
          EXIT_CODE=$?
          set -e
          case $EXIT_CODE in
            0)
              echo "r2_available=true" >> $GITHUB_OUTPUT
              echo "health_status=healthy" >> $GITHUB_OUTPUT
              ;;
            2)
              echo "::warning::R2 health check reported degraded; validating anyway, since R2 answered"
              echo "r2_available=true" >> $GITHUB_OUTPUT
              echo "health_status=degraded" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "r2_available=false" >> $GITHUB_OUTPUT
              echo "health_status=unavailable" >> $GITHUB_OUTPUT
              ;;
          esac

  # Download golden files from R2 when available
  download-golden-files:
    name: Download Golden Files
    needs: health-check
    if: needs.health-check.outputs.r2_available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download from R2
        env:
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_READONLY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_READONLY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_READONLY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_READONLY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_BUCKET_URL }}
        run: |
          echo "Listing the declared set..."
          # Taken separately from the sync below, so a partial download shrinks what the
          # validators see and not what they are held to. A listing that fails fails the
          # job: an unreadable declaration is not an empty one.
          set -o pipefail
          aws s3api list-objects-v2 \
            --bucket tsuku-golden-registry \
            --prefix "$GOLDEN_LISTING_PREFIX" \
            --query 'Contents[].Key' \
            --output json | jq -r '.[]?' > listing.txt
          ./.github/scripts/golden-declared-set.sh \
            --out-dir coverage \
            --exclude-prefix "$GOLDEN_LISTING_EXCLUDE" < listing.txt

          echo "Downloading golden files from R2..."

          mkdir -p r2-raw r2-golden-files/plans

          # Download all plans from R2 (excluding embedded/ for now - registry only)
          # Use AWS CLI s3 sync for efficiency
          aws s3 sync s3://tsuku-golden-registry/plans/ r2-raw/ \
            --exclude "embedded/*" \
            2>&1 || {
              echo "::warning::Some files failed to download, continuing..."
            }

          # Transform R2 structure to git-compatible structure
          # R2:  plans/<letter>/<recipe>/v<version>/<platform>.json
          # Git: plans/<letter>/<recipe>/v<version>-<platform>.json
          echo "Transforming R2 structure to git-compatible format..."
          find r2-raw -name "*.json" -type f | while read -r file; do
            # Extract path components
            # Example: r2-raw/s/serve/v14.2.5/linux-amd64.json
            rel_path="${file#r2-raw/}"
            dir_part=$(dirname "$rel_path")      # s/serve/v14.2.5
            platform=$(basename "$file" .json)   # linux-amd64

            # Split dir_part into letter/recipe/version
            letter=$(echo "$dir_part" | cut -d'/' -f1)
            recipe=$(echo "$dir_part" | cut -d'/' -f2)
            version=$(echo "$dir_part" | cut -d'/' -f3)

            # Create target directory and filename
            target_dir="r2-golden-files/plans/$letter/$recipe"
            target_file="$target_dir/${version}-${platform}.json"

            mkdir -p "$target_dir"
            cp "$file" "$target_file"
          done

          echo "Downloaded and transformed files:"
          find r2-golden-files -name "*.json" | wc -l
          find r2-golden-files -name "*.json" | head -20

      - name: Upload golden files artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-golden-files
          path: r2-golden-files/
          retention-days: 1

      # always(): the declared set is written first in this job, and a failure later in it
      # must not take the declared set down with it. Without it Assert Coverage has
      # nothing to report a shortfall against (run 36304210984).
      - name: Upload declared set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-declared
          path: coverage/declared-*.txt
          if-no-files-found: error
          retention-days: 7

  # Validate all registry recipe golden files (plan generation)
  validate-plans-linux:
    name: Validate Plans (Linux)
    needs: [health-check, download-golden-files]
    if: needs.health-check.outputs.r2_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      failed: ${{ steps.validate.outputs.failed }}
      failed_recipes: ${{ steps.validate.outputs.failed_recipes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download golden files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r2-golden-files
          path: r2-golden-files/

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Cache downloads
        uses: actions/cache@b7e8d49f17405cc70c1c120101943203c98d3a4b # v5.0.3
        with:
          path: ~/.tsuku/cache/downloads
          key: nightly-registry-${{ github.run_id }}
          restore-keys: |
            nightly-registry-

      - name: Build tsuku
        run: CGO_ENABLED=0 go build -o tsuku ./cmd/tsuku

      - name: Validate registry golden files
        id: validate
        # Below the job's cap, so a slow night stops here and the receipt upload still runs.
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLDEN_DIR: r2-golden-files/plans
          COVERAGE_RECEIPT: ${{ github.workspace }}/coverage/receipt-validate-linux.ndjson
        run: |
          # Without pipefail the `if !` below tests `tee`, which always succeeds, and a
          # validation failure never fails this step.
          set -o pipefail
          mkdir -p coverage
          : > "$COVERAGE_RECEIPT"
          echo "Validating registry recipe golden files from R2..."
          FAILED_RECIPES=""

          # Use R2 golden files instead of git-based ones
          if ! ./scripts/validate-all-golden.sh --os linux --category registry --golden-dir "$GOLDEN_DIR" 2>&1 | tee validation.log; then
            # Extract failed recipe names from output
            FAILED_RECIPES=$(grep -oP '(?<=FAIL: )\S+' validation.log | sort -u | tr '\n' ' ' || true)
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "failed_recipes=$FAILED_RECIPES" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "failed=false" >> $GITHUB_OUTPUT

      - name: Upload coverage receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-receipt-validate-linux
          path: coverage/receipt-validate-linux.ndjson
          if-no-files-found: error
          retention-days: 7

  validate-plans-macos:
    name: Validate Plans (macOS)
    needs: [health-check, download-golden-files]
    if: needs.health-check.outputs.r2_available == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      failed: ${{ steps.validate.outputs.failed }}
      failed_recipes: ${{ steps.validate.outputs.failed_recipes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download golden files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r2-golden-files
          path: r2-golden-files/

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Build tsuku
        run: CGO_ENABLED=0 go build -o tsuku ./cmd/tsuku

      - name: Validate registry golden files
        id: validate
        # Below the job's cap, so a slow night stops here and the receipt upload still runs.
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLDEN_DIR: r2-golden-files/plans
          COVERAGE_RECEIPT: ${{ github.workspace }}/coverage/receipt-validate-darwin.ndjson
        run: |
          # Without pipefail the `if !` below tests `tee`, which always succeeds, and a
          # validation failure never fails this step.
          set -o pipefail
          mkdir -p coverage
          : > "$COVERAGE_RECEIPT"
          echo "Validating registry recipe golden files from R2..."
          FAILED_RECIPES=""

          if ! ./scripts/validate-all-golden.sh --os darwin --category registry --golden-dir "$GOLDEN_DIR" 2>&1 | tee validation.log; then
            FAILED_RECIPES=$(grep -oP '(?<=FAIL: )\S+' validation.log | sort -u | tr '\n' ' ' || true)
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "failed_recipes=$FAILED_RECIPES" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "failed=false" >> $GITHUB_OUTPUT

      - name: Upload coverage receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-receipt-validate-darwin
          path: coverage/receipt-validate-darwin.ndjson
          if-no-files-found: error
          retention-days: 7

  # Execute a sample of registry recipe golden files
  execute-sample-linux:
    name: Execute Sample (Linux)
    needs: [health-check, download-golden-files]
    if: needs.health-check.outputs.r2_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.execute.outputs.failed }}
      failed_recipes: ${{ steps.execute.outputs.failed_recipes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download golden files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r2-golden-files
          path: r2-golden-files/

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Cache downloads
        uses: actions/cache@b7e8d49f17405cc70c1c120101943203c98d3a4b # v5.0.3
        with:
          path: ~/.tsuku/cache/downloads
          key: nightly-execution-${{ github.run_id }}
          restore-keys: |
            nightly-execution-

      - name: Build tsuku
        run: CGO_ENABLED=0 go build -o tsuku ./cmd/tsuku

      - name: Setup PATH
        run: echo "$HOME/.tsuku/bin" >> $GITHUB_PATH

      - name: Execute sample registry recipes
        id: execute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sample execution: pick one golden file per letter directory
          # This provides coverage without running all 150+ recipes
          FAILED=()
          EXCLUSIONS_FILE="testdata/golden/execution-exclusions.json"
          GOLDEN_BASE="r2-golden-files/plans"

          is_excluded() {
            local recipe="$1"
            if [ ! -f "$EXCLUSIONS_FILE" ]; then
              return 1
            fi
            local match
            match=$(jq -r --arg r "$recipe" '.exclusions[] | select(.recipe == $r) | .issue' "$EXCLUSIONS_FILE" 2>/dev/null | head -1)
            [ -n "$match" ]
          }

          # One line per letter, whatever happens to it. The declared set is the fixed
          # letters a-z (Assert Coverage writes it), so a letter this loop never reaches, or
          # reaches and finds nothing to run, shows up as not covered instead of being
          # skipped in silence.
          mkdir -p coverage
          RECEIPT=coverage/receipt-execute-sample.ndjson
          : > "$RECEIPT"

          # The download step flattens <recipe>/v<version>/<platform>.json into
          # <recipe>/v<version>-<platform>.json, so that is the name to look for.
          for letter in {a..z}; do
            letter_dir="$GOLDEN_BASE/$letter"
            outcome=no-eligible-recipe

            # Pick first non-excluded recipe in this letter
            for recipe_dir in "$letter_dir"/*/; do
              [ -d "$recipe_dir" ] || continue
              recipe=$(basename "$recipe_dir")

              if is_excluded "$recipe"; then
                echo "Skipping excluded recipe: $recipe"
                continue
              fi

              golden_file=$(find "$recipe_dir" -maxdepth 1 \( -name 'v*-linux-amd64.json' -o -name 'v*-linux-debian-amd64.json' \) | sort | head -1)
              if [ -z "$golden_file" ]; then
                continue
              fi

              echo "::group::Executing $recipe"
              # Fresh TSUKU_HOME per recipe
              export TSUKU_HOME="${{ runner.temp }}/tsuku-$recipe"
              mkdir -p "$TSUKU_HOME/bin"
              echo "$TSUKU_HOME/bin" >> "$GITHUB_PATH"

              if ./tsuku install --plan "$golden_file" --force; then
                outcome=executed
              else
                FAILED+=("$recipe")
                outcome=failed
              fi
              echo "::endgroup::"

              # Only test one recipe per letter for sample execution
              break
            done
            printf '{"item":"%s","outcome":"%s"}\n' "$letter" "$outcome" >> "$RECEIPT"
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "failed_recipes=${FAILED[*]}" >> $GITHUB_OUTPUT
            echo "::error::Failed recipes: ${FAILED[*]}"
            exit 1
          fi
          echo "failed=false" >> $GITHUB_OUTPUT
          echo "Sample execution completed successfully"

      - name: Upload coverage receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-receipt-execute-sample
          path: coverage/receipt-execute-sample.ndjson
          if-no-files-found: error
          retention-days: 7

  # Fail the run when validation was skipped. Nothing was validated, so the run must not
  # conclude success; the escalator carries the failure to this workflow's tracked item.
  report-skipped-validation:
    name: Report Skipped Validation
    needs: health-check
    if: needs.health-check.outputs.r2_available == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Fail because no validation ran
        env:
          HEALTH_STATUS: ${{ needs.health-check.outputs.health_status }}
        run: |
          MESSAGE="Validation did not run: the R2 health check reported '$HEALTH_STATUS', so golden files could not be fetched. No recipe was validated."
          {
            echo "## Nightly validation skipped"
            echo
            echo "$MESSAGE"
            echo
            echo "The R2 Health Check job's log has the request timings and the error."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$MESSAGE"
          exit 1

  # Create issue on validation failure (when R2 is available)
  create-failure-issue:
    name: Create Failure Issue
    needs: [health-check, validate-plans-linux, validate-plans-macos, execute-sample-linux]
    if: failure() && needs.health-check.outputs.r2_available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect failure information
          LINUX_PLAN_FAILED="${{ needs.validate-plans-linux.outputs.failed }}"
          LINUX_PLAN_RECIPES="${{ needs.validate-plans-linux.outputs.failed_recipes }}"
          MACOS_PLAN_FAILED="${{ needs.validate-plans-macos.outputs.failed }}"
          MACOS_PLAN_RECIPES="${{ needs.validate-plans-macos.outputs.failed_recipes }}"
          EXEC_FAILED="${{ needs.execute-sample-linux.outputs.failed }}"
          EXEC_RECIPES="${{ needs.execute-sample-linux.outputs.failed_recipes }}"

          # Build issue body
          BODY="## Nightly Registry Validation Failed

          The nightly validation workflow detected issues with registry recipes.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Failures

          "

          if [ "$LINUX_PLAN_FAILED" = "true" ]; then
            BODY="$BODY
          #### Linux Plan Validation
          Failed recipes: $LINUX_PLAN_RECIPES
          "
          fi

          if [ "$MACOS_PLAN_FAILED" = "true" ]; then
            BODY="$BODY
          #### macOS Plan Validation
          Failed recipes: $MACOS_PLAN_RECIPES
          "
          fi

          if [ "$EXEC_FAILED" = "true" ]; then
            BODY="$BODY
          #### Execution Validation
          Failed recipes: $EXEC_RECIPES
          "
          fi

          BODY="$BODY
          ### Next Steps

          1. Check the workflow run for detailed logs
          2. Determine if failures are due to:
             - External changes (upstream URL, version format)
             - Transient network issues (re-run workflow)
             - Recipe bugs (fix and regenerate golden files)
          3. Update affected recipes and regenerate golden files as needed
          "

          # Check if similar issue already exists
          EXISTING=$(gh issue list --label "nightly-failure" --state open --json number --limit 1 | jq -r '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Adding comment to existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating new issue"
            gh issue create \
              --title "chore: nightly registry validation failed ($(date +%Y-%m-%d))" \
              --body "$BODY" \
              --label "nightly-failure,recipes"
          fi

  # Fail the run when any leg did not cover its declared set (#2608). Runs whatever else
  # happened, including when R2 was unreachable and nothing ran, because that is the case
  # a silent green hides. The legs are named here, not discovered from the receipts that
  # arrived, so a leg that was skipped or killed before uploading is counted as missing.
  assert-coverage:
    name: Assert Coverage
    needs: [health-check, download-golden-files, validate-plans-linux, validate-plans-macos, execute-sample-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download declared sets and receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage/

      - name: Assert every leg covered its declared set
        env:
          R2_AVAILABLE: ${{ needs.health-check.outputs.r2_available }}
          HEALTH_STATUS: ${{ needs.health-check.outputs.health_status }}
        run: |
          # coverage/ exists only if some artifact was downloaded. When nothing was, this
          # step still has to run to the assertion and name every leg's count, so it creates
          # the directory rather than dying on its first write (run 36304210984).
          mkdir -p coverage

          # Owner routing is per workflow, so every failure of this run reaches the same
          # issue. Say which failure this is before the counts, so it can be read there.
          if [ "$R2_AVAILABLE" != "true" ]; then
            echo "::error::R2 ${HEALTH_STATUS:-unknown}: validation did not run, so nothing was validated"
          fi

          # The sample's declared set is fixed here, not supplied by the leg it checks.
          printf '%s\n' {a..z} > coverage/declared-execute-sample.txt

          python3 .github/scripts/checks/assert-coverage.py \
            --leg validate-linux=coverage/coverage-declared/declared-linux.txt:coverage/coverage-receipt-validate-linux/receipt-validate-linux.ndjson \
            --leg validate-darwin=coverage/coverage-declared/declared-darwin.txt:coverage/coverage-receipt-validate-darwin/receipt-validate-darwin.ndjson \
            --leg execute-sample=coverage/declared-execute-sample.txt:coverage/coverage-receipt-execute-sample/receipt-execute-sample.ndjson \
            --pass-outcomes match,excluded,no-recipe,unsupported-platform,executed \
            --fail-outcomes mismatch,eval-failed,missing-platforms,failed,no-eligible-recipe \
            | tee coverage-report.txt
          status=${PIPESTATUS[0]}
          { echo '## Coverage'; echo '```'; cat coverage-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
