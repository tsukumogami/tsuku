# Declared labels for this repository.
#
# This file is the source of truth for the label-reference check: a label named by a
# workflow must appear here. Reconciliation applies this file to the repository and has
# no delete path, so a label present on the repository but absent here is reported and
# never removed -- deleting a label would strip it from every issue already carrying it.
#
# Seeded 2026-09-20 from the 34 labels the repository had, plus the eight the workflows
# referenced but which did not exist. The ninth missing reference, `automation`, is not
# here: r2-cleanup is repointed at `maintenance`, which already exists and which the
# sibling credential-rotation workflow already uses for the same housekeeping.

