[metadata]
name = "nvm"
description = "Node Version Manager — manage multiple active Node.js versions"
homepage = "https://github.com/nvm-sh/nvm"
version_format = "semver"
curated = true
# nvm is a shell function, not a compiled binary. The recipe downloads the source
# archive, installs it to the tool directory, and wires it into shell init via
# install_shell_init.
#
# NVM_DIR is nvm's *data* root, not its program directory: every Node.js version the
# user installs lives under it, along with their global npm packages, the alias/ tree
# that decides which version a new shell gets, and the download cache. So it points at
# {data_dir} — $TSUKU_HOME/data/nvm — which is stable across nvm upgrades and which
# nothing in tsuku ever deletes. Pointing it at {install_dir} would put all of that in a
# versioned directory tsuku reclaims, and upgrading nvm would take the user's Node
# versions with it.
#
# The export has to reach the shell before nvm.sh runs: nvm.sh only honors NVM_DIR when
# it is already set and otherwise self-locates to the directory it was sourced from.
#
# install_program_files copies nvm.sh and nvm-exec into the data root because `nvm exec`
# runs "${NVM_DIR}/nvm-exec", and nvm-exec re-sources nvm.sh from its own directory.
# Without both files there, `nvm exec` and `nvm run` fail while every other subcommand
# keeps working.
#
# `tsuku remove nvm` deletes nvm and those two copies and leaves everything else in
# $TSUKU_HOME/data/nvm. Delete that directory by hand to reclaim the space. An existing
# nvm installed some other way — the usual ~/.nvm — is never read, written, or removed
# by tsuku.
#
# Node versions installed through an earlier tsuku are NOT moved here automatically, and
# `nvm ls` will not see them until they are moved into $TSUKU_HOME/data/nvm by hand.
# Released tsuku left them in $TSUKU_HOME/share/shell.d/, which nothing reclaims. Builds
# between the shell.d lifecycle fix and this change left them in the versioned tool
# directory instead, which IS reclaimed on a 7-day timer — that case is the urgent one.
# See docs/tool-data-directory.md. Recipe-carried migration is tracked in issue #2472.

[version]
github_repo = "nvm-sh/nvm"
tag_prefix = "v"

# Linux (glibc and musl): nvm source archive is pure shell — works on both libc variants
[[steps]]
action = "download_archive"
url = "https://github.com/nvm-sh/nvm/archive/refs/tags/v{version}.tar.gz"
when = { os = ["linux"], libc = ["glibc", "musl"] }
strip_dirs = 1
install_mode = "directory"

# macOS
[[steps]]
action = "download_archive"
url = "https://github.com/nvm-sh/nvm/archive/refs/tags/v{version}.tar.gz"
when = { os = ["darwin"] }
strip_dirs = 1
install_mode = "directory"

[[steps]]
action = "set_env"
vars = [{name = "NVM_DIR", value = "{data_dir}"}]

[[steps]]
action = "install_program_files"
files = ["nvm.sh", "nvm-exec"]

[[steps]]
action = "install_shell_init"
source_file = "nvm.sh"
target = "nvm"
shells = ["bash", "zsh"]

[verify]
command = "test -f {install_dir}/nvm.sh"
mode = "output"
reason = "nvm is a shell function sourced via shell init; verify that the installation file exists instead"
